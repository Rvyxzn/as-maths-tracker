<!-- The ?v= on each asset busts its cache, but nothing busts this file, so a
     stale copy of it can go on requesting last week's scripts and styles.
     Always revalidate the shell; the assets below stay cacheable. -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">

<div id="app" class="app">
  <aside class="sidebar" id="sidebar">
    <button class="brand" id="brand" data-action="switch-subject" title="Switch subject">
      <div class="brand-mark" id="brandMark">∑</div>
      <div class="brand-text">
        <div class="brand-title" id="brandTitle">A-Level Maths</div>
        <div class="brand-sub">Revision Tracker</div>
      </div>
      <span class="brand-caret">▾</span>
    </button>

    <div class="sidebar-foot">
      <div class="countdown-mini" id="countdownMini"></div>
      <div class="who" id="whoAmI"></div>
      <button class="btn btn-ghost btn-sm" id="themeToggle">Toggle theme</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="Menu">☰</button>
      <div class="topbar-title" id="viewTitle">Dashboard</div>
      <div class="topbar-actions">
        <div id="timerSlot"></div>
        <div id="focusSlot"></div>
        <button class="btn btn-primary" id="whatNowBtn">Continue revision</button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="overlay" id="overlay"></div>
<div class="modal-root" id="modalRoot"></div>
