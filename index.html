<title>AS Maths Revision Tracker</title>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

      </div>
    </div>

      <button class="btn btn-ghost btn-sm" id="themeToggle">Toggle theme</button>
    </div>
  </aside>

      <div class="topbar-title" id="viewTitle">Dashboard</div>

        <div id="timerSlot"></div>
        <div id="focusSlot"></div>
        <button class="btn btn-primary" id="whatNowBtn">Continue revision</button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="overlay" id="overlay"></div>
